<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blog Tracker</title>
<meta name="description" content="AI, backend and database posts from the tech blogs I follow, picked by Claude daily.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf9f6; --surface: #ffffff; --text: #1c1b19; --muted: #6b6860;
    --line: #e6e3dc; --accent: #c2410c; --accent-soft: #fdeee6; --chip: #f1efe9;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151413; --surface: #1d1c1a; --text: #ecebe7; --muted: #9c998f;
      --line: #2e2c29; --accent: #fb923c; --accent-soft: #3a2316; --chip: #262422;
    }
  }
  :root[data-theme="dark"] {
    --bg: #151413; --surface: #1d1c1a; --text: #ecebe7; --muted: #9c998f;
    --line: #2e2c29; --accent: #fb923c; --accent-soft: #3a2316; --chip: #262422;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 48px 16px 80px; }
  header h1 {
    font: 600 clamp(30px, 6vw, 42px)/1.1 Newsreader, Georgia, serif;
    letter-spacing: -0.01em; margin: 0 0 6px;
  }
  header p { margin: 0; color: var(--muted); }
  .bar {
    position: sticky; top: 0; z-index: 2; background: var(--bg);
    padding: 20px 0 14px; margin-top: 18px; border-bottom: 1px solid var(--line);
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
  }
  .seg {
    display: inline-flex; padding: 3px; gap: 2px; background: var(--chip);
    border-radius: 10px;
  }
  .seg button {
    font: 500 13px Inter, sans-serif; color: var(--muted); background: none;
    border: 0; border-radius: 7px; padding: 6px 12px; cursor: pointer; white-space: nowrap;
  }
  .seg button:hover { color: var(--text); }
  .seg button[aria-pressed="true"] {
    background: var(--surface); color: var(--text);
    box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 0 0 1px var(--line);
  }
  .select {
    position: relative; display: inline-flex; align-items: center;
  }
  .select select {
    appearance: none; -webkit-appearance: none; font: 500 13px Inter, sans-serif;
    color: var(--text); background: var(--chip); border: 0; border-radius: 10px;
    padding: 9px 32px 9px 12px; cursor: pointer; max-width: 100%;
  }
  .select select:focus-visible, .seg button:focus-visible, .check input:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  .select::after {
    content: ""; position: absolute; right: 13px; top: 50%; width: 6px; height: 6px;
    border: solid var(--muted); border-width: 0 1.5px 1.5px 0;
    transform: translateY(-70%) rotate(45deg); pointer-events: none;
  }
  .spacer { flex: 1; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .check {
    font-size: 13px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center;
    cursor: pointer; white-space: nowrap;
  }
  .check input { accent-color: var(--accent); margin: 0; }
  .tag { font-size: 11px; font-weight: 600; color: var(--muted); border: 1px solid var(--line); padding: 0 7px; border-radius: 999px; }
  .tag.off { border-style: dashed; }
  .post.skipped { opacity: .6; }
  .why { font-size: 13px; color: var(--muted); font-style: italic; margin-top: 3px; }
  h2.day {
    font: 600 12px Inter, sans-serif; text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted); margin: 32px 0 6px;
  }
  .post { display: block; padding: 14px 0; border-bottom: 1px solid var(--line); text-decoration: none; color: inherit; }
  .post:hover .t { color: var(--accent); }
  .meta { font-size: 12.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; margin-bottom: 3px; }
  .meta > * { white-space: nowrap; }
  .src { font-weight: 600; color: var(--text); }
  .new {
    font-size: 11px; font-weight: 600; color: var(--accent); background: var(--accent-soft);
    padding: 1px 7px; border-radius: 999px;
  }
  .t { font: 600 19px/1.3 Newsreader, Georgia, serif; transition: color .15s; }
  .s { color: var(--muted); font-size: 14px; margin-top: 3px;
       display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; margin-top: 24px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 18px 6px; min-width: 0; }
  .card h3 { margin: 0 0 4px; font: 600 20px Newsreader, Georgia, serif; display: flex; justify-content: space-between; gap: 8px; }
  .card h3 a { color: inherit; text-decoration: none; }
  .card h3 a:hover { color: var(--accent); }
  .card .post { padding: 10px 0; }
  .card .post:last-child { border-bottom: 0; }
  .card .t { font-size: 16.5px; }
  .warn { font: 500 12px Inter, sans-serif; color: var(--accent); }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
  footer { margin-top: 48px; color: var(--muted); font-size: 13px; }
  footer a { color: inherit; }
  @media (max-width: 620px) {
    .grid { grid-template-columns: 1fr; }
    .wrap { padding-top: 32px; }
    .bar { gap: 8px; }
    #topics { display: flex; width: 100%; }
    #topics button { flex: 1; padding: 6px 4px; }
    .select { flex: 1 1 100%; }
    .check { margin-right: auto; }
    .select select { width: 100%; }
    .spacer { display: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Blog Tracker</h1>
    <p id="sub"></p>
  </header>
  <div class="bar">
    <div class="seg" id="topics" role="group" aria-label="Topic"></div>
    <label class="select"><span class="sr">Blog</span><select id="blog" aria-label="Blog"></select></label>
    <span class="spacer"></span>
    <label class="check"><input type="checkbox" id="skipped"> Show skipped</label>
    <div class="seg" id="view" role="group" aria-label="View">
      <button type="button" data-view="latest">Latest</button>
      <button type="button" data-view="blogs">By blog</button>
    </div>
  </div>
  <main id="main"></main>
  <footer>Refreshed daily. Full-feed blogs show every post; for the others, Claude keeps the ones about AI, backend engineering or databases. <span id="since"></span></footer>
</div>
<script>
const DATA = /*__DATA__*/null;
const WEEK = 7 * 864e5;
const TOPICS = { ai: "AI", backend: "Backend", databases: "Databases" };
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
const lastVisit = Number(store.get("lastVisit")) || 0;
store.set("lastVisit", String(Date.now()));

const state = {
  blog: "all", topic: "all",
  view: store.get("view") || "latest",
  skipped: store.get("skipped") === "1",
};
const all = DATA.blogs.flatMap(b => b.posts.map(p => ({ ...p, blog: b })))
  .sort((a, b) => b.date.localeCompare(a.date));
const relevant = p => !p.blog.filter || !!(p.verdict && p.verdict.relevant);
const isFresh = p => Date.now() - Date.parse(p.date) < WEEK;
const isUnseen = p => lastVisit && Date.parse(p.seen) > lastVisit;
const pool = () => all.filter(p => relevant(p) || (state.skipped && p.verdict));
const topicsOf = p => (p.verdict && p.verdict.topics) || [];
const byTopic = (p, t = state.topic) => t === "all" || topicsOf(p).includes(t);
const byBlog = (p, b = state.blog) =>
  b === "all" || (b === "people" ? !p.blog.filter : b === "companies" ? p.blog.filter : p.blog.id === b);

const el = (tag, props = {}, ...kids) => {
  const n = Object.assign(document.createElement(tag), props);
  n.append(...kids.filter(k => k != null));
  return n;
};
const safeUrl = u => /^https?:\/\//.test(u) ? u : "#";
const fmtDay = d => new Date(d).toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric", year: "numeric" });
const fmtShort = d => new Date(d).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });

function postEl(p, { showSource = true, showSummary = true } = {}) {
  const ok = relevant(p);
  const meta = el("div", { className: "meta" },
    showSource ? el("span", { className: "src", textContent: p.blog.name }) : null,
    el("span", { textContent: fmtShort(p.date) }),
    ...topicsOf(p).map(t => el("span", { className: "tag", textContent: TOPICS[t] || t })),
    !ok ? el("span", { className: "tag off", textContent: "Skipped" })
      : isUnseen(p) ? el("span", { className: "new", textContent: "New since last visit" })
      : isFresh(p) ? el("span", { className: "new", textContent: "This week" }) : null);
  return el("a", { className: "post" + (ok ? "" : " skipped"), href: safeUrl(p.url), target: "_blank", rel: "noopener", title: (p.verdict && p.verdict.reason) || "" },
    meta, el("div", { className: "t", textContent: p.title }),
    showSummary && p.summary ? el("div", { className: "s", textContent: p.summary }) : null,
    !ok && p.verdict && p.verdict.reason ? el("div", { className: "why", textContent: p.verdict.reason }) : null);
}

function renderFilters() {
  const topics = [["all", "All"], ...Object.entries(TOPICS)];
  document.getElementById("topics").replaceChildren(...topics.map(([id, name]) => {
    const b = el("button", { type: "button", textContent: name, onclick: () => { state.topic = id; render(); } });
    b.setAttribute("aria-pressed", state.topic === id);
    return b;
  }));
  const opt = (value, label) => el("option", { value, textContent: label, selected: state.blog === value });
  const group = (label, blogs) => el("optgroup", { label }, ...blogs.map(b => opt(b.id, b.name)));
  document.getElementById("blog").replaceChildren(
    opt("all", "All blogs"), opt("people", "All full-feed blogs"), opt("companies", "All topic-filtered blogs"),
    group("Full feed", DATA.blogs.filter(b => !b.filter)),
    group("Topic-filtered by Claude", DATA.blogs.filter(b => b.filter)));
}

function renderLatest(main, list) {
  if (!list.length) return main.append(el("p", { className: "empty", textContent: "Nothing matches yet." }));
  let day = "";
  for (const p of list.slice(0, 150)) {
    const d = fmtDay(p.date);
    if (d !== day) { main.append(el("h2", { className: "day", textContent: d })); day = d; }
    main.append(postEl(p));
  }
}

function renderBlogs(main, list) {
  const grid = el("div", { className: "grid" });
  for (const b of [...DATA.blogs].sort((x, y) => x.filter - y.filter)) {
    if (!byBlog({ blog: b })) continue;
    const ps = list.filter(p => p.blog.id === b.id).slice(0, state.blog === "all" ? 5 : 40);
    grid.append(el("section", { className: "card" },
      el("h3", {}, el("a", { href: safeUrl(b.home), target: "_blank", rel: "noopener", textContent: b.name }),
        b.ok ? null : el("span", { className: "warn", textContent: "feed error" })),
      ...(ps.length ? ps.map(p => postEl(p, { showSource: false, showSummary: false }))
        : [el("p", { className: "empty", textContent: "Nothing on these topics yet." })])));
  }
  main.append(grid);
}

function render() {
  store.set("view", state.view);
  store.set("skipped", state.skipped ? "1" : "0");
  renderFilters();
  document.querySelectorAll("#view button").forEach(b => b.setAttribute("aria-pressed", b.dataset.view === state.view));
  document.getElementById("skipped").checked = state.skipped;
  const list = pool().filter(p => byTopic(p) && byBlog(p));
  const main = document.getElementById("main");
  main.replaceChildren();
  (state.view === "blogs" ? renderBlogs : renderLatest)(main, list);
}

document.querySelectorAll("#view button").forEach(b => b.onclick = () => { state.view = b.dataset.view; render(); });
document.getElementById("blog").onchange = e => { state.blog = e.target.value; render(); };
document.getElementById("skipped").onchange = e => { state.skipped = e.target.checked; render(); };
const companyPosts = all.filter(p => p.blog.filter);
const kept = all.filter(relevant);
const judged = companyPosts.filter(p => p.verdict).length;
const keptCompany = companyPosts.filter(relevant).length;
document.getElementById("sub").textContent =
  `Every post from ${DATA.blogs.filter(b => !b.filter).length} blogs, plus AI, backend and database posts from ${DATA.blogs.filter(b => b.filter).length} more · ${kept.filter(isFresh).length} this week · updated ${new Date(DATA.updated).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" })}`;
document.getElementById("since").textContent =
  `From the topic-filtered blogs, Claude kept ${keptCompany} of ${judged} posts.` + (judged < companyPosts.length ? ` ${companyPosts.length - judged} are waiting to be judged.` : "") +
  (lastVisit ? ` Your last visit: ${new Date(lastVisit).toLocaleString()}.` : "");
render();
</script>
</body>
</html>
